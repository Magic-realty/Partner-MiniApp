<!-- Официальный SDK Telegram Mini Apps. ВАЖНО (найдено при разборе пропавшей кнопки "Открыть камеру"
oct24): этого тега раньше не было вообще - window.Telegram.WebApp использовался в коде ниже в расчете на то,
что сам клиент Telegram "подставит" этот объект самостоятельно без официального скрипта. На части версий/
платформ клиент действительно делает это сам (поэтому базовые вещи - ready(), expand(), цвета темы - работали),
но без официального SDK некоторые МЕТОДЫ (в частности showScanQrPopup - открытие встроенного сканера QR) могут
быть недоступны или отсутствовать в "самодельной" версии объекта, которую клиент подставляет без скрипта - это,
по всей видимости, и объясняет, почему кнопка сканирования то была видна, то пропала на одном и том же
устройстве/партнере без каких-либо изменений в нашем коде: за это отвечает исключительно версия/поведение
самого Telegram, а официальный скрипт - самый надежный способ гарантировать полный набор методов независимо
от этого. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.min.js"></script>
<script>
const TG=window.Telegram&&window.Telegram.WebApp;try{TG&&(TG.ready(),TG.expand())}catch(e){}
// --- Видимость демо-панели: скрыта для ВСЕХ внутри Telegram (без исключений), видна только в обычном браузере/артефакте ---
let TG_INIT_RAW=false;try{TG_INIT_RAW=(location.hash.includes("tgWebAppData=")||location.search.includes("tgWebAppData="))}catch(e){}
const IS_IN_TELEGRAM=!!TG||TG_INIT_RAW;
try{if(IS_IN_TELEGRAM){const dp=document.getElementById("demoPanel");if(dp)dp.style.display="none";document.documentElement.classList.add("in-tg");document.body.classList.add("in-tg")}}catch(e){}
// --- Высота приложения всегда точно равна видимой области экрана (без клавиатуры), чтобы вкладки внизу не "уезжали"
// и под ними не появлялось пустое пространство при открытии/закрытии клавиатуры.
// viewportStableHeight (а не viewportHeight) используется первым - это "устоявшееся" значение Telegram,
// которое не дергается во время анимации разворачивания окна (TG.expand()); на старте этой анимации
// viewportHeight может на мгновение вернуть маленькое/промежуточное значение, из-за чего нижняя навигация
// на экране запуска оказывалась слишком низко/за пределами видимой области. visualViewport.height - универсальный
// веб-запасной вариант (iOS Safari/WebView и обычные браузеры), если приложение открыто не в Telegram.
function syncAppHeight(){
 try{
  const ae0=document.activeElement,tag0=ae0&&ae0.tagName,fieldFocused=tag0==="INPUT"||tag0==="TEXTAREA"||tag0==="SELECT";
  let h;
  if(fieldFocused){
   // Пока активно поле ввода (клавиатура, скорее всего, открыта): на разных телефонах и версиях Telegram
   // по-разному обновляется "их" значение высоты - на части устройств TG.viewportHeight/viewportStableHeight
   // вообще не учитывает открытую клавиатуру и остается равным полноэкранной высоте, из-за чего нижняя навигация
   // и кнопки формы оказываются под клавиатурой, хотя visualViewport.height/window.innerHeight на этом же
   // устройстве клавиатуру уже учли и уменьшились. Поэтому здесь берем МИНИМАЛЬНОЕ из всех доступных значений -
   // любое значение, которое учитывает клавиатуру, будет меньше того, что её не учитывает, так что минимум
   // гарантированно не меньше реальной видимой области экрана ни на одном устройстве.
   const cs=[TG&&TG.viewportStableHeight,TG&&TG.viewportHeight,window.visualViewport&&window.visualViewport.height,window.innerHeight].filter(v=>typeof v==="number"&&v>0);
   h=cs.length?Math.min.apply(Math,cs):window.innerHeight;
  }else{
   // Поле не в фокусе (обычный просмотр, не ввод текста): используется прежний порядок приоритета, где
   // "устоявшееся" значение Telegram (viewportStableHeight) идет первым, чтобы не дергаться во время анимации
   // разворачивания окна (TG.expand()) сразу после запуска - см. комментарий выше про старт анимации.
   h=(TG&&TG.viewportStableHeight)||(TG&&TG.viewportHeight)||(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  }
  document.documentElement.style.setProperty("--app-h",h+"px");
 }catch(e){}
 // Пересчет высоты .frame (строка выше) сдвигает весь макет на экране, в том числе активное поле ввода.
 // На iOS мигающий курсор отрисовывается браузером как отдельный слой поверх страницы и привязывается к
 // координате поля В МОМЕНТ последней перерисовки курсора - если макет сдвигается ПОСЛЕ этого (например, когда
 // открывается клавиатура и меняется высота .frame), курсор может остаться на старой координате экрана и
 // визуально оказаться на другом элементе (кнопке, соседнем поле), хотя реальный фокус остается в нужном поле.
 // Принудительно переустанавливаем выделение (это не теряет фокус и не закрывает клавиатуру) - это заставляет
 // WebKit пересчитать и перерисовать курсор уже на правильной, актуальной координате поля.
 try{
  const ae=document.activeElement;
  if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&typeof ae.setSelectionRange==="function"&&typeof ae.selectionStart==="number"){
   const s=ae.selectionStart,e2=ae.selectionEnd;
   requestAnimationFrame(()=>{try{ae.setSelectionRange(s,e2)}catch(err){}});
  }
 }catch(e){}
}
syncAppHeight();
// Повторные догоняющие вызовы сразу после загрузки: TG.expand() разворачивает окно с анимацией длительностью
// до ~300-400мс, и самое первое значение высоты, прочитанное синхронно, может быть неточным/промежуточным -
// эти повторы подхватывают уже устоявшееся значение, когда анимация завершится.
[50,150,300,600,1000].forEach(ms=>{try{setTimeout(syncAppHeight,ms)}catch(e){}});
// visualViewport.resize срабатывает очень часто и на мелкие колебания (например, панель подсказок/автозамены
// над клавиатурой на телефоне то появляется, то пропадает при каждом новом введенном символе) - без задержки
// это заставляло форму пересчитывать высоту буквально на каждое нажатие клавиши, из-за чего поле ввода и
// мигающий курсор в нем визуально "съезжали" ниже с каждым введенным символом. Небольшая задержка (debounce)
// объединяет такие частые срабатывания в одно пересчитанное значение уже после того, как ввод на секунду затих.
let _heightSyncTimer=null;
function syncAppHeightDebounced(){
 clearTimeout(_heightSyncTimer);
 _heightSyncTimer=setTimeout(syncAppHeight,180);
}
try{TG&&TG.onEvent&&TG.onEvent("viewportChanged",syncAppHeight)}catch(e){}
try{window.visualViewport&&window.visualViewport.addEventListener("resize",syncAppHeightDebounced)}catch(e){}
try{window.addEventListener&&window.addEventListener("resize",syncAppHeightDebounced)}catch(e){}
try{window.addEventListener&&window.addEventListener("orientationchange",syncAppHeight)}catch(e){}
try{window.addEventListener&&window.addEventListener("pageshow",syncAppHeight)}catch(e){}
// --- Принудительный сброс "залипшего" масштаба страницы (зум остается приближенным на старом месте ввода
// после перезагрузки страницы через системное меню Telegram "⋮" -> "Reload Page"): WebView может сохранять
// визуальный масштаб страницы через перезагрузку. Кратковременно ужесточаем meta viewport и сразу возвращаем
// исходное значение - это заставляет WebView пересчитать масштаб и сбросить его к 1, не отключая pinch-zoom навсегда.
function resetStuckZoom(){
 try{
  const vp=document.querySelector('meta[name="viewport"]');
  if(!vp)return;
  const original=vp.getAttribute("content");
  vp.setAttribute("content",original+", maximum-scale=1, user-scalable=no");
  const restore=()=>{try{vp.setAttribute("content",original)}catch(e){}};
  (window.requestAnimationFrame||setTimeout)(restore,50);
 }catch(e){}
}
resetStuckZoom();
try{window.addEventListener&&window.addEventListener("pageshow",resetStuckZoom)}catch(e){}
// --- Автовход в админ-панель: если приложение в Telegram открывает именно этот аккаунт, показываем админку вместо кабинета партнера ---
const ADMIN_TG_USERNAME="vadimivanovich01"; // без @
function getTgUser(){
 try{
  let raw=(location.hash.match(/tgWebAppData=([^&]*)/)||location.search.match(/tgWebAppData=([^&]*)/)||[])[1];
  if(!raw)return null;
  const data=new URLSearchParams(decodeURIComponent(raw));
  const userRaw=data.get("user");
  return userRaw?JSON.parse(userRaw):null;
 }catch(e){return null}
}
const TG_USER=getTgUser();
const IS_ADMIN_TG_ACCOUNT=!!(TG_USER&&TG_USER.username&&TG_USER.username.toLowerCase()===ADMIN_TG_USERNAME.toLowerCase());
// --- Привязка каждого реального партнера в Telegram к его собственному стабильному ID (чтобы разные партнеры не "слипались" в одного демо-пользователя p2) ---
const REAL_USER_ID=(IS_IN_TELEGRAM&&TG_USER&&TG_USER.id)?(IS_ADMIN_TG_ACCOUNT?"admin":("tg"+TG_USER.id)):null;
// --- Общая база данных (Firebase Realtime Database): синхронизация заявок, кодов, балансов, выводов и переписки между устройствами ---
const FIREBASE_CONFIG={apiKey:"AIzaSyAUlnUisb0Kp0LVKcwsjCR0xOELIKSKKmU",authDomain:"partner-miniapp.firebaseapp.com",databaseURL:"https://partner-miniapp-default-rtdb.europe-west1.firebasedatabase.app",projectId:"partner-miniapp",storageBucket:"partner-miniapp.firebasestorage.app",messagingSenderId:"456368165048",appId:"1:456368165048:web:2debc5c039b334fe8da44d"};
const SYNC_PATH="state";
// --- Разделение заявок (leads) и заявок на вывод (wd) по отдельным путям, ключованным по id владельца-партнера
// (/leads/{partnerId}, /wd/{partnerId}), вместо единого общего блока "state", где раньше были leads/wd ВМЕСТЕ
// со всеми остальными партнерами - см. stage1_oct25_split_leads_wd_by_owner. Устройство ОБЫЧНОГО партнера
// теперь подписывается ТОЛЬКО на свой собственный путь (leads/{свой id}, wd/{свой id}) и физически не скачивает
// данные остальных партнеров вообще (а не просто "не показывает" их на экране, как было раньше) - это и снижает
// трафик (каждое действие рассылается только тому, кого оно касается, а не всем подряд), и устраняет саму
// возможность для обычного партнера прочитать чужие данные (номера карт, имена клиентов) через консоль браузера
// при обычном использовании приложения (см. аудит безопасности/симуляция атаки oct24). Устройство АДМИНА
// (единственное, кому по смыслу приложения нужно видеть вообще всех) подписывается на ОБА пути целиком (корень
// leads/ и wd/ - поддерево со всеми партнерами), как и раньше. users/dm/codes/L/tombstones остаются в общем

    // немедленно (см. ниже), заявки все равно могли "воскреснуть" из-за ДРУГОГО устройства: если партнер в
    // своем приложении делал любое действие (например просто переключал вкладку) ПОСЛЕ того, как админ уже
    // удалил заявку, но ДО того как партнер успел получить это обновление через подписку - его устройство
    // отправляло свой обычный merge-sync со своей ЕЩЕ СТАРОЙ локальной копией leads (где удаленная заявка
    // еще есть), и mergeById по правилу "никогда не терять запись, присутствующую хотя бы где-то" честно
    // возвращал её обратно в базу - ведь с точки зрения ПРАВИЛ СЛИЯНИЯ это была обычная, а не намеренно
    // удаленная запись. Надгробие решает эту двусмысленность: запись удалена НАВСЕГДА, независимо от того,
    // в чьей локальной копии она еще "жива".
    const mergedTombLeads=Object.assign({},(remote.tombstones&&remote.tombstones.leads)||{},tombstones.leads||{});
    const merged={
     // leads/wd больше не часть этого объединения - см. LEADS_PATH/WD_PATH и scheduleLeadsSync()/scheduleWdSync()
     // users больше тоже не часть этого объединения - см. PROFILES_PATH/USERS_PATH, scheduleUsersSync()/
     // scheduleProfilesSync() (stage1_oct25_users_profiles_split). dm тоже - см. DM_PATH/scheduleDmSync()
     // (stage1_oct25_dm_split). L/codes тоже больше не часть этого объединения - см. CODES_PATH/L_PATH,
     // scheduleCodesSync()/scheduleLSync() (stage1_oct25_codes_L_split, Этап 1 полностью завершен).
     tombstones:{leads:mergedTombLeads}
    };
    tombstones.leads=mergedTombLeads; // подхватываем локально и то, о чем узнали только из remote
    return DB.ref(SYNC_PATH).set(JSON.parse(JSON.stringify(merged)));
   })
    .then(()=>fbDbg("отправлено ✓ ("+new Date().toLocaleTimeString()+")"))
    .catch(e=>fbDbg("ОШИБКА ОТПРАВКИ: "+(e&&e.code||e&&e.message||e)));
  }catch(e){fbDbg("ошибка отправки (sync): "+(e&&e.message||e))}
 },400);

// {partnerId: [массив записей]}, у обычного партнера (видит только свой узел) - просто плоский массив.
function flattenOwnerTree(val,isAll){
 if(!val)return[];
 if(isAll){let out=[];Object.keys(val).forEach(k=>{if(Array.isArray(val[k]))out=out.concat(val[k])});return out}
 return Array.isArray(val)?val:[];
}

function scheduleLeadsSync(){

 if(_forceLeadsOverwrite){

  // очистки) своим текущим (уже отфильтрованным по надгробиям) локальным состоянием, без слияния - по тем же

   }catch(e){fbDbg("ошибка отправки заявок: "+(e&&e.message||e))}
  });
  return;
 }
 clearTimeout(_leadsSyncTimer);
 _leadsSyncTimer=setTimeout(()=>{
  // stage1_oct25_split_leads_wd_dirty_tracking: owners вычисляем ЗДЕСЬ (в момент реального срабатывания
  // таймера), а у админа - НЕ "все известные владельцы", а только те, чей локальный массив прямо сейчас
  // реально отличается от последнего известного/отправленного отпечатка (_lastSyncedLeadsJSON) - иначе
  // админ на каждый свой render() заново перезаписывал бы (слиянием) чужие пути, которые он вообще не
  // трогал, и под нагрузкой это обгоняло/затирало только что созданные партнерами заявки (см. комментарий
  // у объявления _lastSyncedLeadsJSON выше - баг найден реальной нагрузочной симуляцией).
  const owners=_isAdminScope
   ?Object.keys(Object.assign({},_knownLeadOwners,ownerIdsIn(leads))).filter(oid=>{
     const localArr=leads.filter(l=>l.o===oid);
     return JSON.stringify(localArr)!==(_lastSyncedLeadsJSON[oid]||"[]");
    })
   :[cur];
  // oct25_leads_wd_transaction_fix: раньше здесь было .once("value").then(читаем remote → считаем merge →
  // отдельным вызовом .set(merged)). Между ЭТИМ чтением и ЭТОЙ записью есть окно (сетевая задержка в реальном
  // Firebase, в симуляции - просто незавершенные микрозадачи), в которое может влезть ЕЩЕ ОДНА параллельная
  // попытка синхронизации того же пути (например, партнер создал подряд несколько заявок без паузы, и каждая
  // запустила свой цикл "чтение-запись") - и чья запись landится ПОЗЖЕ, та и побеждает целиком, независимо от
  // того, что в ней меньше актуальных данных ("потерянное обновление", lost update). Обнаружено реальной
  // нагрузочной симуляцией 20 партнеров (sim_load_split.js) - под нагрузкой так терялось до половины заявок,
  // хотя они ЦЕЛИКОМ оставались в локальной памяти создавшего их партнера (т.е. сам партнер не терял ничего -
  // просто не все его заявки реально долетали до общей базы). DB.ref(path).transaction(fn) решает это именно
  // для такого случая: fn вызывается с ГАРАНТИРОВАННО актуальным значением на момент самой записи (Firebase
  // сам переповторяет fn, если между чтением и записью что-то изменилось), поэтому чтения и записи здесь не
  // могут "разъехаться" в двух разных промисах.
  owners.forEach(oid=>{
   try{
    DB.ref(LEADS_PATH+"/"+oid).transaction(remoteVal=>{
     const remoteArr=remoteVal||[];
     const localArr=leads.filter(l=>l.o===oid);
     const merged=mergeById(remoteArr,localArr).filter(l=>!(l&&tombstones.leads&&tombstones.leads[l.id]));
     _lastSyncedLeadsJSON[oid]=JSON.stringify(merged);
     return JSON.parse(JSON.stringify(merged));
    })
     .then(()=>fbDbg("заявки отправлены ✓ ("+new Date().toLocaleTimeString()+")"))
     .catch(e=>fbDbg("ошибка отправки заявок: "+(e&&e.code||e&&e.message||e)));
   }catch(e){fbDbg("ошибка отправки заявок: "+(e&&e.message||e))}
  });
 },400);
}

// leads/wd/users, у сообщения ДВА участника - поэтому "владельцы", которым нужно отправить КОПИЮ сообщения,
// вычисляются не по одному полю .o, а по паре (a,b): для обычного партнера - он сам (cur, его собственный
// узел dm/{cur} получает ВСЕ его сообщения, и с поддержкой/админом, и с рефералами) и, дополнительно, каждый
// НЕ-админ собеседник, с которым у него есть переписка (т.к. такому собеседнику нужна СВОЯ копия сообщения в
// ЕГО собственном узле dm/{тот_партнер} - см. комментарий у DM_PATH). Сообщения с админом НЕ дублируются в
// отдельный узел - админ и так подписан на корень целиком.
function dmOtherPartnerIdsFor(selfId){
 const s={};
 (dm||[]).forEach(x=>{
  if(!x)return;
  const other=x.a===selfId?x.b:(x.b===selfId?x.a:null);
  if(other&&other!=="admin"&&other!==selfId)s[other]=true;
 });
 return s;
}
function dmAllNonAdminIdsIn(arr){
 const s={};
 (arr||[]).forEach(x=>{if(!x)return;if(x.a&&x.a!=="admin")s[x.a]=true;if(x.b&&x.b!=="admin")s[x.b]=true});
 return s;
}

// для L (где владелец - получатель бонуса, а не создатель записи, см. комментарий у L_PATH выше).

// выше). Запись ВСЕГДА кросс-владельческая (см. creditReward() - пишущее устройство это l.o, а владелец записи
// по .to это u.inv, ДРУГОЙ партнер) - ровно как переписка между партнерами в DM_PATH, поэтому используется тот
// же механизм: transaction()+mergeById() по стабильному id, никогда не теряющий и не дублирующий записи.

  const owners=_isAdminScope?Object.keys(Object.assign({},_knownLOwners,toIdsIn(L))):[cur];
  _forceLOverwrite=false;
  clearTimeout(_lSyncTimer);
  owners.forEach(oid=>{
   const arr=L.filter(x=>x.to===oid);
   try{
    DB.ref(L_PATH+"/"+oid).set(JSON.parse(JSON.stringify(arr)))
     .then(()=>{_lastSyncedLJSON[oid]=JSON.stringify(arr);fbDbg("бонусы отправлены ✓ ("+new Date().toLocaleTimeString()+")")})
     .catch(e=>fbDbg("ошибка отправки бонусов: "+(e&&e.code||e&&e.message||e)));
   }catch(e){fbDbg("ошибка отправки бонусов: "+(e&&e.message||e))}
  });

 }
 clearTimeout(_lSyncTimer);
 _lSyncTimer=setTimeout(()=>{
  const owners=_isAdminScope
   ?Object.keys(Object.assign({},_knownLOwners,toIdsIn(L))).filter(oid=>{
     const localArr=L.filter(x=>x.to===oid);
     return JSON.stringify(localArr)!==(_lastSyncedLJSON[oid]||"[]");
    })
   // У обычного партнера новая запись в L почти всегда для ЧУЖОГО .to (см. creditReward() - начисление
   // бонуса ПРИГЛАСИВШЕМУ), а не для cur - поэтому, как и dmOtherPartnerIdsFor() для переписки, берем cur
   // плюс все .to, фактически присутствующие прямо сейчас в локальном L.
   :Object.keys(Object.assign({[cur]:true},toIdsIn(L)));

     const remoteArr=remoteVal||[];
     const localArr=L.filter(x=>x.to===oid);
     const merged=mergeById(remoteArr,localArr);
     _lastSyncedLJSON[oid]=JSON.stringify(merged);

     .catch(e=>fbDbg("ошибка отправки бонусов: "+(e&&e.code||e&&e.message||e)));
   }catch(e){fbDbg("ошибка отправки бонусов: "+(e&&e.message||e))}
  });
 },400);
}

function buildPhone(d){
 if(!d)return"";
 const r=d.length>1?d.slice(1):"";
 let out="+7";
 if(r.length)out+="("+r.slice(0,3);
 if(r.length>=3)out+=")";
 if(r.length>3)out+=r.slice(3,6);
 if(r.length>=6)out+="-";
 if(r.length>6)out+=r.slice(6,8);
 if(r.length>=8)out+="-";
 if(r.length>8)out+=r.slice(8,10);
 return out}

 // намеренно, иначе действия на ОДНОМ устройстве могли бы сами открывать/закрывать экран блокировки на
 // ДРУГОМ. Поэтому здесь сбрасываются только синхронизируемые поля (pin/pinAttempts/blocked). При следующем
 // входе партнера в приложение (а мини-приложение Telegram перезапускается при каждом открытии) сработает
 // обычная автоблокировка уже активированного профиля (см. ready0/_firstSyncApplied) - партнер увидит экран
 // "ник", а т.к. синхронизированный код-пароль пуст, вместо ввода старого пароля ему предложат придумать
 // новый (см. chatLocked()/lockPinCreateTap()), под тем же ником.
 // pinUpdatedAt=serverNow() здесь КРИТИЧЕН, а не просто для порядка: именно он защищает этот сброс от гонки с
 // другим устройством партнера, см. комментарий в scheduleSync()/fix_cross_device_pin_reset_race_oct23 - при
 // слиянии побеждает версия с БОЛЬШИМ pinUpdatedAt, а не та, что просто синхронизировалась раньше/позже.
 // Используется именно serverNow() (время сервера Firebase), а не Date.now() (время по часам устройства
 // администратора) - см. fix_pinUpdatedAt_clock_skew_oct24 в lockPinTap() выше: сравнение должно идти по
 // ЕДИНОЙ временной шкале, иначе расхождение часов между устройствами делает результат непредсказуемым.
 p.pin=null;p.pinAttempts=0;p.blocked=false;p.pinUpdatedAt=serverNow();p.blockedChatOpen=false;
 render();
}

let _resetArmed=false,_resetArmTimer=null;
function adminResetAll(){
 if(U[cur].id!=="admin")return;
 // Два нажатия подряд вместо браузерного confirm() — в Telegram Mini Apps стандартные диалоги confirm/alert
 // заблокированы и не работают надежно, поэтому подтверждение сделано прямо в интерфейсе приложения.
 if(!_resetArmed){
  _resetArmed=true;clearTimeout(_resetArmTimer);
  _resetArmTimer=setTimeout(()=>{_resetArmed=false;render()},5000);
  return render();
 }
 _resetArmed=false;clearTimeout(_resetArmTimer);
 _forceFullOverwrite=true; // полный сброс должен реально стереть данные в общей базе, а не слиться со старыми
 _forceLeadsOverwrite=true;_forceWdOverwrite=true; // то же самое, но для отдельных путей leads/wd (см. выше)
 _forceUsersOverwrite=true;_forceProfilesOverwrite=true; // то же самое, но для users/profiles (см. выше)
 _forceDmOverwrite=true; // то же самое, но для переписки (dm, см. DM_PATH выше)
 _forceCodesOverwrite=true;_forceLOverwrite=true; // то же самое, но для кодов/бонусов (codes/L, см. CODES_PATH/L_PATH выше)
 const now=Date.now();leads.forEach(l=>{tombstones.leads[l.id]=now}); // см. fix_cross_device_delete_race_oct23
 wd.forEach(w=>{tombstones.wd[w.id]=now}); // см. tombstones.wd выше
 leads=[];wd=[];L=[];dm=[];codes=[{c:"START-0001",o:"admin"}];
 Object.keys(U).forEach(id=>{if(id!=="admin")delete U[id]});
 U.p1=mk("p1","@alexey",true,"admin");U.p1.msgs.push({id:genId(),t:ONB,b:1,ts:Date.now()});
 U.p2=mk("p2","",false,null);
 U.admin.viewPartner=null;
 if(!U[cur])cur="admin";
 render();
}
function toggleLead(i){leads[i]._expanded=!leads[i]._expanded;render()}
function leadSearchInput(v){
 // РАНЬШЕ: render() всегда полностью перестраивает innerHTML, поэтому обычный oninput+render() уничтожал бы
 // сам DOM-элемент поля ввода на каждое нажатие клавиши, а фокус/курсор приходилось восстанавливать вручную
 // (focus()+setSelectionRange на конец строки). На практике это оказалось ненадежным на телефонах - после
 // программного focus() виртуальная клавиатура иногда закрывается/мигает, и это реально прерывало набор
 // текста администратором ровно так, как было описано в жалобе ("поиск... не сбрасывает возможность
 // текущего ввода" - админ должен успевать дописать ФИО целиком, а подходящие варианты подтягиваются сами).
 // ИСПРАВЛЕНИЕ: вместо полного render() обновляем ТОЛЬКО список заявок (#admLeadsList) - поле ввода
 // никогда не пересоздается, поэтому фокус и позиция курсора сохраняются сами собой, без каких-либо хаков.
 U.admin.leadSearchFio=v;
 const el=document.getElementById("admLeadsList");
 if(el)el.innerHTML=admLeadsListHtml();
}
let _clearLeadsArmed=0,_clearLeadsArmTimer=null;
function adminClearLeadsHistory(){
 if(U[cur].id!=="admin")return;
 // Три нажатия подряд (а не два, как в "Опасной зоне" на вкладке Партнеры) - по явной просьбе заказчика,
 // чтобы снизить риск случайного удаления всей истории заявок прямо с рабочей вкладки, которой пользуются чаще.
 if(_clearLeadsArmed<2){
  _clearLeadsArmed++;clearTimeout(_clearLeadsArmTimer);
  _clearLeadsArmTimer=setTimeout(()=>{_clearLeadsArmed=0;render()},5000);
  return render();
 }
 _clearLeadsArmed=0;clearTimeout(_clearLeadsArmTimer);
 _forceFullOverwrite=true; // намеренное удаление - слияние (см. scheduleSync) здесь недопустимо, см. adminResetAll
 _forceLeadsOverwrite=true; // то же самое, но для отдельного пути leads (см. LEADS_PATH выше)
 // "Надгробия" на все удаляемые id - защита от воскрешения заявок при синхронизации с ДРУГОГО устройства
 // партнера (см. комментарий в scheduleSync()/fix_cross_device_delete_race_oct23), независимо от того, успел
 // ли дойти до него этот момент УЖЕ немедленной (не ждущей debounce) записи, см. fix предыдущего сообщения.
 const now=Date.now();leads.forEach(l=>{tombstones.leads[l.id]=now});
 leads=[];
 render();
}

function adminDeleteSelectedLeads(){

 // историю"/"Сбросить все тестовые данные", поэтому слияние (см. scheduleSync) здесь так же недопустимо -
 // иначе удаленные заявки "воскреснут" при следующей синхронизации с другого устройства.
 _forceFullOverwrite=true;
 _forceLeadsOverwrite=true; // то же самое, но для отдельного пути leads (см. LEADS_PATH выше)

 _selLeads={};
 render();
}

 if(filterStatus&&x.st!==filterStatus)return "";
 if(searchFio&&!(x.fio||"").toLowerCase().includes(searchFio))return "";

 if(!x._expanded){

 ${x.priceCurrent?`<div class="mu" style="margin-top:4px">Цена текущая: ${rub(x.priceCurrent)}</div>`:""}

 }
 return `<div class="c" style="position:relative">${sel}${head}
 <button style="margin-top:6px" onclick="toggleLead(${i})">Свернуть</button>
 <select id="st${i}" style="margin-top:10px">${[...MAIN,...PAUSE].map(s=>`<option ${s==x.st?"selected":""}>${s}</option>`).join("")}</select>

 </div>`}).join("")||'<div class="mu">Заявок нет</div>'}
