// --- Высота приложения всегда точно равна видимой области экрана (без клавиатуры), чтобы вкладки внизу не "уезжали"
// и под ними не появлялось пустое пространство при открытии/закрытии клавиатуры.
// viewportStableHeight (а не viewportHeight) используется первым - это "устоявшееся" значение Telegram,
// которое не дергается во время анимации разворачивания окна (TG.expand()); на старте этой анимации
// viewportHeight может на мгновение вернуть маленькое/промежуточное значение, из-за чего нижняя навигация

// веб-запасной вариант (iOS Safari/WebView и обычные браузеры), если приложение открыто не в Telegram.
function syncAppHeight(){
 try{
  const h=(TG&&TG.viewportStableHeight)||(TG&&TG.viewportHeight)||(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  document.documentElement.style.setProperty("--app-h",h+"px");
 }catch(e){}
}
syncAppHeight();
// Повторные догоняющие вызовы сразу после загрузки: TG.expand() разворачивает окно с анимацией длительностью
// до ~300-400мс, и самое первое значение высоты, прочитанное синхронно, может быть неточным/промежуточным -
// эти повторы подхватывают уже устоявшееся значение, когда анимация завершится.
[50,150,300,600,1000].forEach(ms=>{try{setTimeout(syncAppHeight,ms)}catch(e){}});
try{TG&&TG.onEvent&&TG.onEvent("viewportChanged",syncAppHeight)}catch(e){}
try{window.visualViewport&&window.visualViewport.addEventListener("resize",syncAppHeight)}catch(e){}
try{window.addEventListener&&window.addEventListener("resize",syncAppHeight)}catch(e){}
try{window.addEventListener&&window.addEventListener("orientationchange",syncAppHeight)}catch(e){}

// исходное значение - это заставляет WebView пересчитать масштаб и сбросить его к 1, не отключая pinch-zoom навсегда.
function resetStuckZoom(){
 try{
  const vp=document.querySelector('meta[name="viewport"]');
  if(!vp)return;
  const original=vp.getAttribute("content");
  vp.setAttribute("content",original+", maximum-scale=1, user-scalable=no");
  const restore=()=>{try{vp.setAttribute("content",original)}catch(e){}};
  (window.requestAnimationFrame||setTimeout)(restore,50);
 }catch(e){}
}

 ${x.paid?(x.credited?`<div class="mu" style="margin-top:6px"><span class="ok">Начислено на баланс: ${rub(x.rw)}</span></div>`:`<div class="r" style="margin-top:8px;align-items:center"><span class="mu">Вознаграждение ${rub(x.rw)} не начислено</span><button onclick="creditReward(${i})">Начислить на баланс</button></div>`):""}
 </div>`}).join("")||'<div class="mu">Заявок нет</div>';

function admWdView(){
 const FLABEL={inn:"ИНН",kpp:"КПП",rname:"Наименование получателя",rs:"Расчетный счет (р/с)",bank:"Банк получателя",bik:"БИК",ks:"Корр. счет",fio:"ФИО получателя",card:"Номер карты",wallet:"Номер кошелька ЮMoney"};
 const tag=x=>x.status=="pending"?'<span class="tag st-yellow">В обработке</span>':x.status=="approved"?'<span class="tag st-green">Одобрено</span>':'<span class="tag st-red">Отклонено</span>';
 const w=wd.map((x,i)=>{
  const o=U[x.o];
  const inv=o.inv?(o.inv=="admin"?"администратора":U[o.inv].nick):"—";
  const details=x._open?`<div style="margin-top:8px">
 <div class="mu">${esc(x.sys||"—")}, ${esc(x.stat||"—")}</div>
 <div class="lcard" style="margin-top:6px">${Object.entries(x.fields||{}).map(([k,v])=>`<div class="lrow"><span>${FLABEL[k]||k}</span><span>${k=="card"?esc(v).replace(/(.{4})/g,"$1 ").trim():esc(v)}</span></div>`).join("")}</div>
 ${x.status=="pending"?`<div style="font-weight:600;margin-top:10px;margin-bottom:2px">Комментарий партнеру</div><input id="wdc${i}" value="${esc(x.comment||"")}" onclick="event.stopPropagation()">
 <div class="r" style="margin-top:8px"><button class="p" onclick="event.stopPropagation();wdDecide(${i},'approved')">Одобрить</button><button onclick="event.stopPropagation();wdDecide(${i},'rejected')">Отклонить</button></div>`:
 `<div class="mu" style="margin-top:6px">${x.comment?"Комментарий: "+esc(x.comment):"Без комментария"}</div>`}
 </div>`:"";
  return `<div class="c" style="cursor:pointer" onclick="wdSetOpen(${i})">
 <div style="font-weight:600">${o.nick}${o.on?"":" ⏳"} <span class="mu">· ${rub(x.s)}</span></div>
 <div class="mu">${esc(o.name)||"—"} · ${esc(o.fld)||"—"} · от ${inv}</div>
 <div style="margin-top:4px">${tag(x)}</div>
 ${details}
 </div>`}).join("")||'<div class="mu">Нет запросов</div>';
 return w}
render();
